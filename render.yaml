services:
  # Backend Web Service
  - type: web
    name: nexusdb-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python backend/db/init_sqlite.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.8

  # Frontend Static Site
  - type: static
    name: nexusdb-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexusdb-backend
          property: host
