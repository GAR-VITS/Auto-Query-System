  - id: q26
    natural_language_query: "Total principal for delinquent loans"
    category: "business_definitions"
    gold_sql: "SELECT sum(l.principal) as delinquent_principal FROM bank.loans l WHERE l.loan_id IN (SELECT DISTINCT r.loan_id FROM bank.repayments r WHERE r.days_past_due >= 30)"
    expected_row_count_min: 1
    expected_columns: ["delinquent_principal"]
