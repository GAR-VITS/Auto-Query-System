    category: "reconciliations"
    gold_sql: "SELECT entry_date, debit, credit FROM bank.ledger_entries WHERE account_id = 10482 ORDER BY entry_date DESC LIMIT 10"
    expected_row_count_min: 1
    expected_columns: ["entry_date", "debit", "credit"]
    must_contain_tables: ["bank.ledger_entries"]
    should_clarify: false

