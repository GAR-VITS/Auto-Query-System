  # Category 7: Reconciliations & Governed Actions (4)
  - id: q37
    natural_language_query: "Reconcile daily ledger vs transaction sums for account 10482"
    category: "reconciliations"
    gold_sql: "SELECT le.account_id, le.entry_date, sum(le.credit - le.debit) as ledger_net, coalesce(sum(CASE WHEN t.direction = 'CR' THEN t.amount ELSE -t.amount END), 0) as txn_net FROM bank.ledger_entries le LEFT JOIN bank.transactions t ON le.account_id = t.account_id AND strftime('%Y-%m-%d', t.txn_ts) = le.entry_date WHERE le.account_id = 10482 GROUP BY le.account_id, le.entry_date"
    expected_row_count_min: 1
    expected_columns: ["account_id", "entry_date", "ledger_net", "txn_net"]
    must_contain_tables: ["bank.ledger_entries", "bank.transactions"]
    should_clarify: false

  - id: q38
    natural_language_query: "Find all ledger entries with reconciliation mismatches"
    category: "reconciliations"
    gold_sql: "SELECT le.entry_id, le.account_id, le.entry_date, le.debit, le.credit FROM bank.ledger_entries le JOIN bank.accounts a ON le.account_id = a.account_id WHERE abs(a.balance - le.credit) > 0.01 LIMIT 10"
    expected_row_count_min: 1
    expected_columns: ["entry_id", "account_id", "entry_date", "debit", "credit"]
    must_contain_tables: ["bank.ledger_entries", "bank.accounts"]
    should_clarify: false

  - id: q39
