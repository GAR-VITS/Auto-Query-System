[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusdb-backend"
version = "1.0.0"
description = "NexusDB: Self-correcting multi-agent SQL and governed write-back platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "sqlglot>=25.0.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "chromadb>=0.5.0",
    "pandas>=2.2.0",
    "google-genai>=0.1.0",
    "faker>=26.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
